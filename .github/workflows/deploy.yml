name: Deploy HEP Jobs Tracker

on:
  schedule:
    - cron: '0 8 * * *'  # Run daily at 8 AM UTC
  workflow_dispatch:     # Allow manual triggering

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build website
        run: |
          echo "🔬 Building HEP Jobs Tracker..."
          node build-modular.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit updated data
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ip-jobs.json data/ajo-jobs.json data/desy-jobs.json
          if git diff --staged --quiet; then
            echo "📊 No new jobs found"
          else
            git commit -m "🔄 Update jobs data (InspireHEP + AJO + DESY) - $(date '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ Updated jobs database"
          fi