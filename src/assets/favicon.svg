<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c93ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5fd9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#f6f8fa"/>
  
  <!-- Nucleus -->
  <circle cx="16" cy="16" r="4" fill="url(#faviconGradient)"/>
  
  <!-- Electron orbits -->
  <ellipse cx="16" cy="16" rx="12" ry="4" fill="none" stroke="url(#faviconGradient)" stroke-width="1.5" transform="rotate(0 16 16)"/>
  <ellipse cx="16" cy="16" rx="12" ry="4" fill="none" stroke="url(#faviconGradient)" stroke-width="1.5" transform="rotate(60 16 16)"/>
  <ellipse cx="16" cy="16" rx="12" ry="4" fill="none" stroke="url(#faviconGradient)" stroke-width="1.5" transform="rotate(120 16 16)"/>
  
  <!-- Electrons -->
  <circle cx="28" cy="16" r="2" fill="#ff6b6b"/>
  <circle cx="28" cy="16" r="2" fill="#ff6b6b" transform="rotate(60 16 16)"/>
  <circle cx="28" cy="16" r="2" fill="#ff6b6b" transform="rotate(120 16 16)"/>
</svg>
