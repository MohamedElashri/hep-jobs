<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c93ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5fd9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#f6f8fa"/>
  
  <!-- Nucleus -->
  <circle cx="90" cy="90" r="22" fill="url(#appleGradient)"/>
  
  <!-- Electron orbits -->
  <ellipse cx="90" cy="90" rx="65" ry="22" fill="none" stroke="url(#appleGradient)" stroke-width="3" transform="rotate(0 90 90)"/>
  <ellipse cx="90" cy="90" rx="65" ry="22" fill="none" stroke="url(#appleGradient)" stroke-width="3" transform="rotate(60 90 90)"/>
  <ellipse cx="90" cy="90" rx="65" ry="22" fill="none" stroke="url(#appleGradient)" stroke-width="3" transform="rotate(120 90 90)"/>
  
  <!-- Electrons -->
  <circle cx="155" cy="90" r="5" fill="#ff6b6b"/>
  <circle cx="155" cy="90" r="5" fill="#ff6b6b" transform="rotate(60 90 90)"/>
  <circle cx="155" cy="90" r="5" fill="#ff6b6b" transform="rotate(120 90 90)"/>
</svg>
