<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="atomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c93ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5fd9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="electronGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d94646;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f6f8fa" stroke="#7c93ff" stroke-width="2"/>
  
  <!-- Nucleus -->
  <circle cx="100" cy="100" r="12" fill="url(#atomGradient)"/>
  
  <!-- Electron orbit 1 -->
  <ellipse cx="100" cy="100" rx="70" ry="25" fill="none" stroke="url(#atomGradient)" stroke-width="2" transform="rotate(0 100 100)"/>
  
  <!-- Electron orbit 2 -->
  <ellipse cx="100" cy="100" rx="70" ry="25" fill="none" stroke="url(#atomGradient)" stroke-width="2" transform="rotate(60 100 100)"/>
  
  <!-- Electron orbit 3 -->
  <ellipse cx="100" cy="100" rx="70" ry="25" fill="none" stroke="url(#atomGradient)" stroke-width="2" transform="rotate(120 100 100)"/>
  
  <!-- Electrons -->
  <circle cx="170" cy="100" r="6" fill="url(#electronGradient)">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="100" r="6" fill="url(#electronGradient)">
    <animateTransform attributeName="transform" type="rotate" from="60 100 100" to="420 100 100" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="100" r="6" fill="url(#electronGradient)">
    <animateTransform attributeName="transform" type="rotate" from="120 100 100" to="480 100 100" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Job/position indicator (briefcase icon simplified) -->
  <rect x="85" y="88" width="30" height="20" rx="3" fill="none" stroke="#4a5fd9" stroke-width="2"/>
  <path d="M 92 88 L 92 84 Q 92 82 95 82 L 105 82 Q 108 82 108 84 L 108 88" fill="none" stroke="#4a5fd9" stroke-width="2"/>
</svg>
